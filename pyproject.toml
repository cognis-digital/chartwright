[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-chartwright"
version = "0.1.1"
description = "Helm-chart templating, linting & values-diff without a Helm binary"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "helm", "kubernetes", "devsecops", "gitops", "cli", "self-hosted", "cognis-neural-suite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/chartwright"

[project.scripts]
"chartwright-emit" = "chartwright.connect:emit_main"
chartwright = "chartwright.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chartwright"]

[tool.hatch.metadata]
allow-direct-references = true
